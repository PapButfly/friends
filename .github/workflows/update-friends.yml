name: Update Friends

on:
  issues:
    types: [closed]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install dependencies
        run: npm install @octokit/rest @actions/github
      
      - name: Update friends data
        run: |
          node -e '
            const fs = require("fs");
            const { Octokit } = require("@octokit/rest");
            const { context } = require("@actions/github");
      
            const octokit = new Octokit({ auth: process.env.GITHUB_TOKEN });
      
            async function main() {
              const { data: issues } = await octokit.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "closed",
                labels: ["友链"]
              });
      
              const friends = issues.map(issue => {
                const [name, link, avatar, descr] = issue.body.split("\\n").map(line => line.split(": ")[1]);
                return { name, link, avatar, descr, tag: "大佬" };
              });
      
              fs.writeFileSync("friends.json", JSON.stringify(friends, null, 2));
      
              const { execSync } = require("child_process");
              execSync("git config user.name github-actions");
              execSync("git config user.email github-actions@github.com");
              execSync("git add friends.json");
              execSync("git commit -m \"Update friends.json\"");
              execSync("git push");
            }
      
            main();
          '
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
