name: Update Friends

on:
  issues:
    types: [closed]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.TOKEN }}
          fetch-depth: 0

      - name: Generate Friends List from JSON Template
        id: generate
        run: |
          ISSUES=$(curl -s -H "Authorization: token ${{ secrets.TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/issues?state=closed&labels=%E5%8F%8B%E9%93%A6")

          # Extract the JSON block and process it
          FRIENDS_LIST=$(echo "$ISSUES" | jq -r '.[] | .body | split("```json")[1] | split("```")[0]')

          if [ -z "$FRIENDS_LIST" ]; then
            echo "No valid JSON found. Creating an empty list."
            echo "[]" > friends.json
          else
            # Collect all JSON objects into a single array
            echo "[" > friends.json
            echo "$FRIENDS_LIST" | while read -r line; do
              if [[ "$line" =~ \{.+\} ]]; then
                echo "$line" >> friends.json
              fi
            done
            echo "]" >> friends.json
          fi

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add friends.json
          git commit -m "Update friends.json via GitHub Actions"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
