name: Update Friends

on:
  issues:
    types: [closed]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.TOKEN }}
          fetch-depth: 0

      - name: Generate Friends List from Template
        id: generate
        run: |
          # Get all closed issues
          ISSUES=$(curl -s -H "Authorization: token ${{ secrets.TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/issues?state=closed&labels=%E5%8F%8B%E9%93%A6")

          # Extract JSON from each issue body
          FRIENDS_JSON=$(echo "$ISSUES" | jq -r '
            map(
              .body | 
              capture("```json(?<json_data>.*)```") | 
              .json_data
            ) | .[]'
          )

          # If there is no JSON data, create an empty file.
          if [ -z "$FRIENDS_JSON" ] || [ "$FRIENDS_JSON" = "null" ]; then
            echo "[]" > friends.json
          else
            # Collect all JSON objects into a single array
            echo "[" > friends.json
            echo "$FRIENDS_JSON" | while read -r line; do
              if [[ -n "$line" ]]; then
                echo "$line" >> friends.json
              fi
            done
            echo "]" >> friends.json
          fi

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add friends.json
          git commit -m "Update friends.json via GitHub Actions"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
