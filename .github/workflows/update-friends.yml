name: Update Friends

on:
  issues:
    types: [closed]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Friends List
        run: |
          # Get all closed issues with "友链" label
          ISSUES=$(curl -s -H "Authorization: token ${{ secrets.TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/issues?state=closed&labels=%E5%8F%8B%E9%93%BE" | jq -r 'map({name: .title, link: .body | split("\n")[0] | split(": ")[1], avatar: .body | split("\n")[1] | split(": ")[1], descr: .body | split("\n")[2] | split(": ")[1], tag: "大佬"})')

          # Create or update friends.json
          echo "$ISSUES" > friends.json

          # Check if the file was created
          if [ ! -f "friends.json" ]; then
            echo "friends.json was not created. Exiting."
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add friends.json
          git commit -m "Update friends.json via GitHub Actions"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
